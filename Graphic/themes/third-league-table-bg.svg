<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="base" x1="140" y1="40" x2="1780" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.48" stop-color="#030817"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(255 175) rotate(38) scale(735 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1650 740) rotate(-145) scale(660 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="0" cy="0" r="1" gradientTransform="translate(1015 110) rotate(90) scale(300 600)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E11D48" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="960" y1="0" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pitchStroke" x1="1250" y1="500" x2="1900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#93C5FD" stroke-opacity="0.035"/>
      <circle cx="0" cy="0" r="1.5" fill="#BAE6FD" fill-opacity="0.09"/>
    </pattern>
    <pattern id="microDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#E0F2FE" fill-opacity="0.065"/>
    </pattern>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="27"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.065"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#blueGlow)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#roseGlow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Stadium light beams give the static background depth without competing
       with dense table data placed above the image. -->
  <g opacity="0.65">
    <path d="M180 0H420L820 760H520L180 0Z" fill="url(#beam)"/>
    <path d="M760 0H910L1120 690H900L760 0Z" fill="url(#beam)"/>
    <path d="M1510 0H1735L1410 690H1175L1510 0Z" fill="url(#beam)"/>
  </g>

  <!-- Abstract pitch geometry anchors the right-hand side and remains subtle
       enough to stay readable behind translucent match and statistics panels. -->
  <g stroke="url(#pitchStroke)" stroke-width="3">
    <path d="M1260 470L1875 610L1750 1035L1135 895L1260 470Z"/>
    <path d="M1567 540L1442 965"/>
    <ellipse cx="1505" cy="752" rx="106" ry="88" transform="rotate(13 1505 752)"/>
    <path d="M1260 470L1385 498L1334 670L1209 642"/>
    <path d="M1875 610L1750 582L1699 754L1824 782"/>
  </g>

  <g opacity="0.28" filter="url(#softBlur)">
    <ellipse cx="185" cy="900" rx="250" ry="155" fill="#1D4ED8"/>
    <ellipse cx="1710" cy="280" rx="210" ry="125" fill="#0891B2"/>
    <ellipse cx="1010" cy="105" rx="170" ry="90" fill="#BE123C"/>
  </g>

  <g opacity="0.18" stroke="#7DD3FC">
    <path d="M0 940C260 850 430 1040 710 925C970 818 1160 1000 1450 900C1640 835 1795 850 1920 910"/>
    <path d="M0 976C260 886 430 1076 710 961C970 854 1160 1036 1450 936C1640 871 1795 886 1920 946" stroke-opacity="0.45"/>
  </g>

  <path d="M0 0H1920V1080H0V0Z" fill="url(#microDots)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.42"/>
  <rect x="0.5" y="0.5" width="1919" height="1079" stroke="#38BDF8" stroke-opacity="0.05"/>
</svg>
